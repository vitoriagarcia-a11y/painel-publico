async function decG(kb,iv,ct){if(!NAT)return PJ.dec(kb,iv,ct);const dk=await crypto.subtle.importKey('raw',kb,'AES-GCM',false,['decrypt']);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv},dk,ct))}
async function pbk(p,salt,it){if(!NAT){await new Promise(r=>setTimeout(r,60));return PJ.pbkdf2(ENC.encode(p),salt,it)}const km=await crypto.subtle.importKey('raw',ENC.encode(p),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},km,256))}
function mostrar(html){const d=new DOMParser().parseFromString(html,'text/html');document.title=d.title||document.title;
document.head.querySelectorAll('style').forEach(x=>x.remove());d.head.querySelectorAll('style,meta[name=viewport]').forEach(x=>document.head.appendChild(document.importNode(x,true)));
const nb=document.importNode(d.body,true);document.body.replaceWith(nb);
nb.querySelectorAll('script').forEach(o=>{const n=document.createElement('script');n.textContent=o.textContent;o.replaceWith(n)})}
async function abrir(k){mostrar(DEC.decode(await decG(b64d(k),b64d(B.iv),b64d(B.ct))))}
async function entrar(u,p){const id=await id12(u.trim().toLowerCase());const a=B.users.find(x=>x.id===id);if(!a)throw Error('x');
const key=await pbk(p,b64d(a.s),a.it);
const raw=await decG(key,b64d(a.i),b64d(a.w));const d=JSON.parse(DEC.decode(raw));
try{sessionStorage.setItem('ic_sess',JSON.stringify({k:d.k,r:d.r,n:d.n}))}catch(e){}await abrir(d.k)}
let falhas=0,ate=0;$('#vs').onclick=()=>{const p=$('#p'),m=p.type==='password';p.type=m?'text':'password';$('#vs').textContent=m?'Ocultar':'Mostrar'};
const DOM=/^[a-z0-9._%+-]+@totvs\.com(\.br)?$/;
$('#f').onsubmit=ev=>{ev.preventDefault()};
$('#b').type='button';$('#f').addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id!=='vs'){ev.preventDefault();$('#b').click()}});
$('#b').onclick=async()=>{const b=$('#b'),e=$('#e');e.textContent='';
const u=$('#u').value.trim().toLowerCase();if(!DOM.test(u)){e.textContent='Use seu e-mail corporativo TOTVS (@totvs.com.br).';return}
if(Date.now()<ate){e.textContent='Muitas tentativas. Aguarde '+Math.ceil((ate-Date.now())/1000)+' segundos.';return}
b.disabled=true;b.textContent='Verificando…';await new Promise(r=>setTimeout(r,30));
try{await entrar(u,$('#p').value)}catch(x){falhas++;if(falhas>=5){ate=Date.now()+60000;falhas=0;e.textContent='Muitas tentativas. Aguarde 60 segundos.'}else e.textContent='E-mail ou senha incorretos.';b.disabled=false;b.textContent='Entrar'}};
(async()=>{try{const s=JSON.parse(sessionStorage.getItem('ic_sess')||'null');if(s&&s.k)await abrir(s.k)}catch(e){try{sessionStorage.removeItem('ic_sess')}catch(_){}}})();
if(!NAT)$('#e').textContent='';
})();
</script></body></html>
